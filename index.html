<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Steam Multi-Farm PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #09090b; color: #fafafa; font-family: 'Inter', sans-serif; }
        .log-box { font-family: 'Fira Code', monospace; font-size: 0.75rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        .tab-btn.active { border-bottom: 2px solid #818cf8; color: #818cf8; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Cores dinâmicas para o console */
        .log-info { color: #60a5fa; }
        .log-success { color: #4ade80; }
        .log-warning { color: #facc15; }
        .log-error { color: #f87171; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4">
    <div class="flex-1 w-full max-w-md mx-auto flex flex-col">
        <h1 class="text-3xl font-black mt-2 mb-1 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-purple-500 tracking-tight">
            Steam Multi-Farm
        </h1>
        <p class="text-center text-xs text-gray-500 mb-4">Open Source Edition v2.0</p>

        <!-- Abas -->
        <div class="flex mb-4 border-b border-gray-800">
            <button class="tab-btn active flex-1 py-3 text-sm font-semibold text-gray-400 transition" onclick="switchTab('main')">Painel</button>
            <button class="tab-btn flex-1 py-3 text-sm font-semibold text-gray-400 transition" onclick="switchTab('achievements')">Conquistas</button>
            <!-- [DEEPSEEK-TODO]: Adicionar aba de 'Configurações' para gerenciar auto-reconnect, temas e notificações nativas push -->
        </div>

        <!-- Aba Principal -->
        <div id="main" class="tab-content active space-y-4 flex-1">
            <form id="farmForm" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Usuário</label>
                        <input type="text" id="username" class="w-full p-3 bg-[#18181b] rounded-xl border border-gray-800 focus:border-blue-500 outline-none transition" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Senha</label>
                        <input type="password" id="password" class="w-full p-3 bg-[#18181b] rounded-xl border border-gray-800 focus:border-blue-500 outline-none transition" required>
                    </div>
                </div>

                <!-- [DEEPSEEK-TODO]: Criar integração com CapacitorJS para ler o código do Steam Guard direto das notificações do celular e preencher o Shared Secret auto. -->
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">Shared Secret (2FA Auto)</label>
                    <input type="text" id="sharedSecret" placeholder="Opcional" class="w-full p-3 bg-[#18181b] rounded-xl border border-gray-800 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Modo de Operação</label>
                        <select id="mode" class="w-full p-3 bg-[#18181b] rounded-xl border border-gray-800 outline-none text-purple-400 font-semibold">
                            <option value="hours">⌚ Farm de Horas</option>
                            <option value="cards">🃏 Farm de Cartas</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Visibilidade</label>
                        <select id="status" class="w-full p-3 bg-[#18181b] rounded-xl border border-gray-800 outline-none">
                            <option value="invisible">Invisível</option>
                            <option value="online">Online</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">AppIDs (Máx 32 jogos)</label>
                    <input type="text" id="games" placeholder="Ex: 730, 440, 252490" class="w-full p-3 bg-[#18181b] rounded-xl border border-gray-800 outline-none">
                </div>

                <div class="flex gap-2 pt-2" id="controls">
                    <button type="submit" id="btnStart" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-90 text-white font-bold py-4 rounded-xl shadow-lg transition">🚀 Iniciar Motor</button>
                    <button type="button" id="btnPause" class="hidden flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl shadow-lg transition">⏸ Pausar</button>
                    <button type="button" id="btnStop" class="hidden flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-4 rounded-xl shadow-lg transition">⏹ Desligar</button>
                </div>
            </form>
        </div>

        <!-- Aba Conquistas -->
        <div id="achievements" class="tab-content space-y-4 flex-1">
            <div class="p-5 bg-[#18181b] rounded-xl border border-gray-800">
                <h3 class="text-sm font-bold text-gray-300 mb-2">Desbloqueio Manual (SAM Web)</h3>
                <p class="text-xs text-gray-500 mb-4">O motor principal precisa estar ativo na aba Painel.</p>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">ID do Jogo (AppID)</label>
                        <input type="text" id="achAppId" placeholder="Ex: 730" class="w-full p-3 bg-black rounded-lg border border-gray-700 outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Nome da Conquista (API Name)</label>
                        <input type="text" id="achId" placeholder="Ex: WIN_BOMB_PLANT" class="w-full p-3 bg-black rounded-lg border border-gray-700 outline-none focus:border-purple-500">
                    </div>
                    <button onclick="unlockAchievement()" class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg shadow-lg transition flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Desbloquear
                    </button>
                </div>
            </div>
        </div>

        <!-- Console -->
        <div class="mt-6 pb-2">
            <div class="flex items-center justify-between mb-2 px-1">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Terminal do Motor</h3>
                <span class="relative flex h-2.5 w-2.5"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-blue-500"></span></span>
            </div>
            <div id="logs" class="log-box bg-[#050505] p-4 rounded-xl h-48 overflow-y-auto border border-gray-800 shadow-inner"></div>
        </div>
    </div>

    <script>
        const socket = io();
        const logsDiv = document.getElementById('logs');
        
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        socket.on('log', (data) => {
            const p = document.createElement('div');
            p.textContent = data.message; 
            p.className = `mb-1 log-${data.type}`; // Aplica a cor com base no tipo de log
            logsDiv.appendChild(p);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        });

        document.getElementById('farmForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                sharedSecret: document.getElementById('sharedSecret').value,
                status: document.getElementById('status').value,
                games: document.getElementById('games').value,
                mode: document.getElementById('mode').value,
                remember: true
            };
            
            try {
                await fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                document.getElementById('btnStart').classList.add('hidden');
                document.getElementById('btnPause').classList.remove('hidden');
                document.getElementById('btnStop').classList.remove('hidden');
            } catch (err) {
                console.error("Erro de rede ao iniciar", err);
            }
        });

        document.getElementById('btnPause').addEventListener('click', async () => {
            await fetch('/api/pause', { method: 'POST' });
        });

        document.getElementById('btnStop').addEventListener('click', async () => {
            await fetch('/api/stop', { method: 'POST' });
            document.getElementById('btnStart').classList.remove('hidden');
            document.getElementById('btnPause').classList.add('hidden');
            document.getElementById('btnStop').classList.add('hidden');
        });

        async function unlockAchievement() {
            const appId = document.getElementById('achAppId').value;
            const achId = document.getElementById('achId').value;
            await fetch('/api/achievements', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ appId, achievementId: achId }) 
            });
        }
    </script>
</body>
</html>
